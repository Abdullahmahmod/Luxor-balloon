<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب - Luxor Balloon Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-shell auth-page">
    <div class="auth-grid-single auth-grid">
      <div class="auth-panel auth-panel-primary narrow-panel">
        <a class="brand-kicker" href="index.html">← العودة للرئيسية</a>
        
        <h1 class="auth-title">إنشاء حساب جديد</h1>
        <p class="auth-copy">انضم إلينا وابدأ حجز رحلات المنطاد بسهولة</p>
        
        <form class="auth-form" action="#">
          <label class="auth-field">
            <span>الاسم الكامل</span>
            <input type="text" name="name" required placeholder="أحمد محمد">
          </label>
          
          <label class="auth-field">
            <span>البريد الإلكتروني</span>
            <input type="email" name="email" required placeholder="name@example.com">
          </label>
          
          <label class="auth-field">
            <span>كلمة المرور</span>
            <input type="password" name="password" required>
          </label>
          
          <button class="button primary auth-submit" type="submit">إنشاء حساب</button>
        </form>
        
        <div class="auth-secondary-actions">
          <span>لديك حساب بالفعل؟</span>
          <a href="login.html">تسجيل الدخول</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
