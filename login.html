<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - Luxor Balloon Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-shell auth-page">
    <div class="auth-grid-single auth-grid">
      <div class="auth-panel auth-panel-primary narrow-panel">
        <a class="brand-kicker" href="index.html">← العودة للرئيسية</a>
        
        <h1 class="auth-title">تسجيل الدخول</h1>
        <p class="auth-copy">مرحباً بك مجدداً في منصة حجز المنطاد</p>
        
        <form class="auth-form" action="#">
          <label class="auth-field">
            <span>البريد الإلكتروني</span>
            <input type="email" name="email" required placeholder="name@example.com">
          </label>
          
          <label class="auth-field">
            <span>كلمة المرور</span>
            <input type="password" name="password" required>
          </label>
          
          <button class="button primary auth-submit" type="submit">تسجيل الدخول</button>
        </form>
        
        <div class="auth-secondary-actions">
          <span>ليس لديك حساب؟</span>
          <a href="register.html">إنشاء حساب جديد</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
